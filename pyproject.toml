[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeeval-bench"
version = "1.0.0"
authors = [
    { name = "Harshit Nigam", email = "nigamh708@gmail.com" }
]
description = "Automated LLM Code Generation & Reasoning Evaluation Framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=8.0.0"
]

[project.scripts]
codeeval = "codeeval.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
